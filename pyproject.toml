[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woocommerce-connector"
version = "0.1.0"
description = "Read-only MCP connector for WooCommerce REST API v3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
wc-mcp-server = "woocommerce_connector.server:main_sync"

[tool.hatch.build.targets.wheel]
packages = ["src/woocommerce_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
